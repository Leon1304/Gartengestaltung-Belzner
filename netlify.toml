# Bilder sind versioniert und aendern sich nur mit einem neuen Commit,
# darum darf der Browser sie lange behalten.
[[headers]]
  for = "/Bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Die Groessenstaffel aus scripts/bilder.mjs — gleiche Regel, eigener Eintrag,
# damit sie nicht von der Tiefe des Pfadmusters abhaengt.
[[headers]]
  for = "/Bilder/opt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Schriftdateien tragen Gewicht und Subset im Namen und werden nie ueberschrieben.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Die drei Bibliotheken aendern sich nur bei einem bewussten Versionswechsel.
# 30 Tage statt immutable: nach einem Update sind Besucher spaetestens nach
# einem Monat auf dem neuen Stand, ohne dass bei jedem Besuch angefragt wird.
# js/recht.js bleibt absichtlich draussen — es aendert sich mit der Seite.
[[headers]]
  for = "/js/gsap.min.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/ScrollTrigger.min.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/js/lenis.min.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Logos, Favicons, Teilen-Bild: aendern sich selten, Veralten ist harmlos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Sicherheitsheader fuer alle Auslieferungen. Die CSP ist auf genau das
# zugeschnitten, was die Seite tut: eigene Dateien, Inline-Skripte und
# -Styles (statische Seite ohne Nonces), data:-URI fuer den Select-Pfeil,
# Google Maps nur als Iframe nach Klick. Alles andere ist gesperrt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com https://maps.google.com https://consent.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
